services:

  nginx:
    image: nginx:alpine
    container_name: industriot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - react
      - phpmyadmin
    restart: always
    networks:
      - industriot_network
    environment:
      TZ: Africa/Tunis

  laravel:
    build:
      context: ./industriot-api
      dockerfile: Dockerfile
    container_name: industriot_laravel
    restart: always
    working_dir: /var/www
    expose:
      - "8000"
    volumes:
      - ./industriot-api:/var/www
    env_file:
      - ./industriot-api/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - industriot_network
    environment:
      TZ: Africa/Tunis

  mqtt-listener:
    build:
      context: ./industriot-api
      dockerfile: Dockerfile
    container_name: industriot_mqtt_listener
    command: php artisan mqtt:ecouter
    restart: always
    working_dir: /var/www
    volumes:
      - ./industriot-api:/var/www
    env_file:
      - ./industriot-api/.env
    depends_on:
      mysql:
        condition: service_healthy
      laravel:
        condition: service_started
    networks:
      - industriot_network
    environment:
      TZ: Africa/Tunis

  react:
    build:
      context: ./industriot-front
      dockerfile: Dockerfile
    container_name: industriot_react
    expose:
      - "80"
    depends_on:
      - laravel
    restart: always
    networks:
      - industriot_network
    environment:
      TZ: Africa/Tunis

  mysql:
    image: mysql:8.0
    container_name: industriot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: industriot
      TZ: Africa/Tunis
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - industriot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: industriot_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      TZ: Africa/Tunis
    depends_on:
      - mysql
    networks:
      - industriot_network

volumes:
  mysql_data:

networks:
  industriot_network:
    driver: bridge